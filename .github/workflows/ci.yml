name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  csfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - run: composer install --working-dir=tools/phpcs
      - run: composer csfix -- --dry-run --diff

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: composer test
