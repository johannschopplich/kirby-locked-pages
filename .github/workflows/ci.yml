name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit
