name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  php:
    name: php (Kirby ${{ matrix.kirby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        kirby: ["5", "6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          coverage: none

      - if: matrix.kirby == '5'
        run: composer install --no-interaction --no-progress
      - if: matrix.kirby == '6'
        run: composer update getkirby/cms --with "getkirby/cms:^6.0@beta" --with-all-dependencies --no-interaction --no-progress
      - run: vendor/bin/phpunit
