type: group
fields:
  lockedPagesEnable:
    type: toggle
    translate: false
    label:
      en: Page Protection
      de: Seitenschutz
      fr: Protection de la page
      nl: Paginabeveiliging
    text:
      en: Password-protect this page?
      de: Seite mit Passwort schützen?
      fr: Protéger cette page par un mot de passe ?
      nl: Deze pagina met een wachtwoord beveiligen?
  lockedPagesPassword:
    label:
      en: Password
      de: Passwort
      fr: Mot de passe
      nl: Wachtwoord
    type: text
    translate: false
    icon: lock
    required: true
    when:
      lockedPagesEnable: true
